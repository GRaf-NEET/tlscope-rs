[package]
name = "TLScope"
version = "0.4.0"
edition = "2021"
description = "Local explicit HTTP/HTTPS debugging proxy for child processes"
license = "MIT"
readme = "README.md"

[lib]
name = "tlscope"
path = "src/lib.rs"

[[bin]]
name = "TLScope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
crossterm = "0.28"
dirs = "5"
flate2 = "1.1"
hex = "0.4"
h2 = "0.4"
http = "1"
httparse = "1.9"
libc = "0.2"
ratatui = "0.29"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
time = "0.3"
tokio = { version = "1.40", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
webpki-roots = "0.26"
x509-parser = "0.16"

[dev-dependencies]
tempfile = "3"

